trigger:
  tags:
    include:
      - "v*"
  branches:
    exclude:
      - "*"
pr: none

pool:
  vmImage: windows-latest

stages:
  - stage: Build
    jobs:
      - job: Build
        displayName: "Build"
        steps:
          - pwsh: |
              nuget restore $(Build.Repository.LocalPath)\cs-windows-firewall-bouncer.sln
            displayName: "Restore build deps"

          - task: VSBuild@1
            displayName: "Build bouncer"
            inputs:
              solution: '$(Build.Repository.LocalPath)\cs-windows-firewall-bouncer.sln'
              vsVersion: '17.0'
              msbuildArgs: '-t:cs-windows-firewall-bouncer:rebuild'
              platform: 'x64'
              configuration: 'Release'

          - pwsh: |
              $build_version = "$(Build.SourceBranchName)"
              if ($build_version.StartsWith("v")) { $build_version = $build_version.Substring(1) }
              Write-Host "##vso[task.setvariable variable=BuildVersion;isOutput=true]$build_version"
            displayName: "Get build version"
            name: GetVersion

          - pwsh: |
              $src = "$(Build.Repository.LocalPath)\cs-windows-firewall-bouncer\bin\x64\Release\net10.0-windows"
              $dst = "$(Build.ArtifactStagingDirectory)\cs-windows-firewall-bouncer\bin\x64\Release\net10.0-windows"
              New-Item -ItemType Directory -Path $dst -Force | Out-Null
              Copy-Item -Path "$src\*" -Destination $dst -Recurse
            displayName: "Stage bouncer binaries"

          - task: PublishPipelineArtifact@1
            displayName: "Upload unsigned binaries artifact"
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)'
              artifact: 'unsigned_binaries'

  - stage: Sign
    dependsOn: Build
    condition: succeeded()
    variables:
      - group: 'FOSS Build Variables'
      - name: BuildVersion
        value: $[ stageDependencies.Build.Build.outputs['GetVersion.BuildVersion'] ]
    jobs:
      - job: WaitForSignApproval
        displayName: "Wait for sign approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualIntervention@8
            displayName: "Approve signing"
            inputs:
              instructions: 'Review the unsigned_binaries artifact from the Build stage, then approve to start signing with the production certificate.'
      - job: Sign
        displayName: "Sign"
        dependsOn: WaitForSignApproval
        steps:
          - download: current
            artifact: unsigned_binaries
            displayName: "Download unsigned binaries"

          - task: CopyFiles@2
            displayName: "Restore binaries into workspace"
            inputs:
              SourceFolder: '$(Pipeline.Workspace)/unsigned_binaries'
              TargetFolder: '$(Build.SourcesDirectory)'

          - task: DotNetCoreCLI@2
            displayName: "Install sign tool"
            inputs:
              command: 'custom'
              custom: 'tool'
              arguments: install --global sign --version 1.1.5

          - task: AzureKeyVault@2
            displayName: "Get signing parameters"
            inputs:
              azureSubscription: "Azure subscription"
              KeyVaultName: "$(KeyVaultName)"
              SecretsFilter: "TenantId,ClientId,ClientSecret,Certificate,KeyVaultUrl"

          - pwsh: |
              sign code azure-key-vault `
              "*.{exe,dll}" `
              --base-directory "$(Build.SourcesDirectory)\cs-windows-firewall-bouncer\bin\x64\Release\net10.0-windows" `
              --publisher-name "CrowdSec" `
              --description "CrowdSec Windows Firewall Bouncer" `
              --description-url "https://github.com/crowdsecurity/cs-windows-firewall-bouncer" `
              --azure-key-vault-tenant-id "$(TenantId)" `
              --azure-key-vault-client-id "$(ClientId)" `
              --azure-key-vault-client-secret "$(ClientSecret)" `
              --azure-key-vault-certificate "$(Certificate)" `
              --azure-key-vault-url "$(KeyVaultUrl)"
            displayName: "Sign bouncer binaries"

          - pwsh: |
              nuget restore $(Build.SourcesDirectory)\cs-windows-firewall-bouncer.sln
            displayName: "Restore build deps"

          - task: VSBuild@1
            displayName: "Build MSI"
            inputs:
              solution: '$(Build.SourcesDirectory)\cs-windows-firewall-bouncer.sln'
              vsVersion: '17.0'
              msbuildArgs: '-t:cs-windows-firewall-bouncer-setup /p:BuildProjectReferences=false /p:RunWixToolsOutOfProc=true'
              platform: 'x64'
              configuration: 'Release'

          - pwsh: |
              sign code azure-key-vault `
              "*.msi" `
              --base-directory "$(Build.SourcesDirectory)\cs-windows-firewall-bouncer-setup\bin\x64\Release" `
              --publisher-name "CrowdSec" `
              --description "CrowdSec Windows Firewall Bouncer" `
              --description-url "https://github.com/crowdsecurity/cs-windows-firewall-bouncer" `
              --azure-key-vault-tenant-id "$(TenantId)" `
              --azure-key-vault-client-id "$(ClientId)" `
              --azure-key-vault-client-secret "$(ClientSecret)" `
              --azure-key-vault-certificate "$(Certificate)" `
              --azure-key-vault-url "$(KeyVaultUrl)"
            displayName: "Sign MSI"

          - pwsh: |
              .\make_choco.ps1
            displayName: "Build Chocolatey package"

          - pwsh: |
              sign code azure-key-vault `
              "*.nupkg" `
              --base-directory "$(Build.SourcesDirectory)\Chocolatey\crowdsec-windows-firewall-bouncer" `
              --publisher-name "CrowdSec" `
              --description "CrowdSec Windows Firewall Bouncer" `
              --description-url "https://github.com/crowdsecurity/cs-windows-firewall-bouncer" `
              --azure-key-vault-tenant-id "$(TenantId)" `
              --azure-key-vault-client-id "$(ClientId)" `
              --azure-key-vault-client-secret "$(ClientSecret)" `
              --azure-key-vault-certificate "$(Certificate)" `
              --azure-key-vault-url "$(KeyVaultUrl)"
            displayName: "Sign Chocolatey package"

          - task: PublishPipelineArtifact@1
            displayName: "Upload signed MSI artifact"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\cs-windows-firewall-bouncer-setup\bin\x64\Release\cs_windows_firewall_bouncer_setup.msi'
              artifact: 'signed_msi'

          - task: PublishPipelineArtifact@1
            displayName: "Upload signed Chocolatey artifact"
            inputs:
              targetPath: '$(Build.SourcesDirectory)\Chocolatey\crowdsec-windows-firewall-bouncer\crowdsec-windows-firewall-bouncer.$(BuildVersion).nupkg'
              artifact: 'signed_nupkg'

  - stage: Publish
    dependsOn: Sign
    condition: succeeded()
    variables:
      - group: 'FOSS Build Variables'
      - name: BuildVersion
        value: $[ stageDependencies.Build.Build.outputs['GetVersion.BuildVersion'] ]
    jobs:
      - job: WaitForPublishApproval
        displayName: "Wait for publish approval"
        pool: server
        timeoutInMinutes: 1440
        steps:
          - task: ManualIntervention@8
            displayName: "Approve publish"
            inputs:
              instructions: 'Review the signed_msi and signed_nupkg artifacts from the Sign stage, then approve to publish to GitHub Releases and Chocolatey.'
      - deployment: "Publish"
        displayName: "Publish to GitHub and Chocolatey"
        dependsOn: WaitForPublishApproval
        environment: github
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: signed_msi
                  displayName: "Download signed MSI"
                - download: current
                  artifact: signed_nupkg
                  displayName: "Download signed Chocolatey package"
                - bash: |
                    tag=$(curl -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/crowdsecurity/cs-windows-firewall-bouncer/releases | jq -r '. | map(select(.prerelease==true)) | sort_by(.created_at) | reverse | .[0].tag_name')
                    echo "##vso[task.setvariable variable=LatestPreRelease;isOutput=true]$tag"
                  name: GetLatestPrerelease
                - task: AzureKeyVault@2
                  displayName: "Get Chocolatey API key"
                  inputs:
                    azureSubscription: "Azure subscription"
                    KeyVaultName: "$(KeyVaultName)"
                    SecretsFilter: 'ChocolateyAPIKey'
                - task: GitHubRelease@1
                  displayName: "Attach assets to GitHub release"
                  inputs:
                    gitHubConnection: "github.com_blotus"
                    repositoryName: '$(Build.Repository.Name)'
                    action: 'edit'
                    tag: '$(GetLatestPrerelease.LatestPreRelease)'
                    assetUploadMode: 'replace'
                    isPreRelease: true #we force prerelease because the pipeline is invoked on tag creation, which happens when we do a prerelease
                    assets: |
                      $(Pipeline.Workspace)/signed_msi/*.msi
                      $(Pipeline.Workspace)/signed_nupkg/*.nupkg
                  condition: ne(variables['GetLatestPrerelease.LatestPreRelease'], '')
                - pwsh: |
                    choco apikey --key $(ChocolateyAPIKey) --source https://push.chocolatey.org/
                    choco push $(Pipeline.Workspace)\signed_nupkg\crowdsec-windows-firewall-bouncer.$(BuildVersion).nupkg --source https://push.chocolatey.org/
                  displayName: "Push to Chocolatey"
                  condition: ne(variables['GetLatestPrerelease.LatestPreRelease'], '')
